<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>视频播放</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            overflow: hidden;
            color: #fff;
        }
        .container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }
        video {
            max-width: 100%;
            max-height: 100%;
            width: 100%;
            height: auto;
            object-fit: contain;
            border-radius: 6px;
            outline: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <video 
            src="05becba5d6eb3e6591b392f2c523e7f3.mp4"
            controls
            autoplay
            muted
            playsinline
            loop
        ></video>
    </div>

    <script>
        const video = document.getElementById('video');
        video.play().catch(err => {
            console.log('自动播放被浏览器限制，点击播放即可', err);
        });
    </script>
</body>
</html>
